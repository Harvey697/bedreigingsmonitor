        <ul>
          <li><strong>Kritiek NCSC-NL Alarm:</strong> Actieve exploitatie van PHP2Shell (CVE-2026-109618, CVSS 9.8) en Google Brotli Node2Shell RCE (CVE-2026-111497, CVSS 9.6) op Nederlandse web- en cloud-infrastructuur.</li>
